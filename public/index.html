<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSH Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Auth -->
  <div id="view-auth" class="view active">
    <div class="auth-container">
      <div class="auth-box">
        <div class="logo">SSH</div>
        <div class="subtitle">TERMINAL</div>
        <div class="input-group">
          <input type="password" id="access-key" placeholder="Access Key" autofocus>
        </div>
        <button id="btn-auth" onclick="handleAuth()">ENTER</button>
        <div id="auth-error" class="error-msg"></div>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <div id="view-menu" class="view">
    <div class="menu-container">
      <div class="menu-header">SSH TERMINAL</div>
      <div class="menu-buttons">
        <button onclick="showView('servers')" class="menu-btn">
          <span class="btn-icon">◈</span>
          <span>My Servers</span>
        </button>
        <button onclick="showView('connect')" class="menu-btn">
          <span class="btn-icon">▶</span>
          <span>Connect to Server</span>
        </button>
        <button onclick="showView('add-server')" class="menu-btn">
          <span class="btn-icon">+</span>
          <span>Add New Server</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Servers -->
  <div id="view-servers" class="view">
    <div class="page-container">
      <div class="page-header">
        <button onclick="showView('menu')" class="back-btn">←</button>
        <h2>My Servers</h2>
      </div>
      <div id="servers-list" class="list-container"></div>
    </div>
  </div>

  <!-- Connect -->
  <div id="view-connect" class="view">
    <div class="page-container">
      <div class="page-header">
        <button onclick="showView('menu')" class="back-btn">←</button>
        <h2>Connect to Server</h2>
      </div>
      <div id="connect-list" class="list-container"></div>
    </div>
  </div>

  <!-- Add Server -->
  <div id="view-add-server" class="view">
    <div class="page-container">
      <div class="page-header">
        <button onclick="showView('menu')" class="back-btn">←</button>
        <h2>Add New Server</h2>
      </div>
      <form class="server-form" onsubmit="handleAddServer(event)">
        <div class="form-group">
          <label>Server Name</label>
          <input type="text" name="name" placeholder="My Server" required>
        </div>
        <div class="form-group">
          <label>Host</label>
          <input type="text" name="host" placeholder="192.168.1.1 or example.com" required>
        </div>
        <div class="form-row">
          <div class="form-group flex-2">
            <label>Username</label>
            <input type="text" name="username" placeholder="root" required>
          </div>
          <div class="form-group flex-1">
            <label>Port</label>
            <input type="number" name="port" value="22" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="submit-btn">Add Server</button>
        <div id="add-error" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- Edit Server -->
  <div id="view-edit-server" class="view">
    <div class="page-container">
      <div class="page-header">
        <button onclick="showView('servers')" class="back-btn">←</button>
        <h2>Edit Server</h2>
      </div>
      <form class="server-form" onsubmit="handleEditServer(event)">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>Server Name</label>
          <input type="text" id="edit-name" required>
        </div>
        <div class="form-group">
          <label>Host</label>
          <input type="text" id="edit-host" required>
        </div>
        <div class="form-row">
          <div class="form-group flex-2">
            <label>Username</label>
            <input type="text" id="edit-username" required>
          </div>
          <div class="form-group flex-1">
            <label>Port</label>
            <input type="number" id="edit-port" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password (leave blank to keep current)</label>
          <input type="password" id="edit-password" placeholder="New password">
        </div>
        <button type="submit" class="submit-btn">Save Changes</button>
        <div id="edit-error" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- Terminal -->
  <div id="view-terminal" class="view">
    <div class="terminal-wrapper">
      <div class="terminal-header">
        <span id="terminal-title">Connecting...</span>
        <button onclick="disconnectTerminal()" class="close-term">✕</button>
      </div>
      <div id="terminal-container"></div>
      <div class="terminal-bar">
        <input type="text" id="quick-command" placeholder="Quick command..." disabled>
        <div class="quick-buttons">
          <button onclick="sendCtrlC()" title="Ctrl+C (SIGINT)" disabled>^C</button>
          <button onclick="sendCtrlD()" title="Ctrl+D (EOF)" disabled>^D</button>
          <button onclick="openUploadDialog()" title="Upload File" disabled>UP</button>
          <button onclick="disconnectTerminal()" title="Disconnect">DC</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Upload File</h3>
        <button onclick="closeUploadDialog()" class="close-btn">✕</button>
      </div>
      <div class="modal-body">
        <input type="file" id="file-input">
        <div class="form-group">
          <label>Destination path</label>
          <input type="text" id="upload-path" placeholder="~/">
        </div>
        <button onclick="handleUpload()" class="submit-btn">Upload</button>
        <div id="upload-status"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
